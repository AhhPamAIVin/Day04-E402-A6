tools:
  - name: clarify
    description: "Ask one necessary question and pause. Use for missing policy context, missing account/URL, or yes/no confirmation before an external write."
    parameters:
      type: object
      properties:
        question: {type: string, description: "One concise question in the user's language."}
        response_type: {type: string, enum: [text, yes_no, choice], default: text, description: "text for missing information; yes_no before send/post/publish."}
        options: {type: array, default: [], items: {type: string}}
      required: [question, response_type]

  - name: policy
    description: "Search TechNova internal policy markdown in internal-policies/. Use for company rules and return evidence with title, section and source_path. It does not make management or legal decisions."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Focused internal-policy question or keywords."}
        policy_area:
          type: string
          enum: [all, employee_handbook, leave, remote_work, it_security, expense_reimbursement, travel, performance_review, code_of_conduct, equipment, data_privacy]
          default: all
          description: "Select the matching TechNova policy collection; use all only for cross-policy or uncertain-area searches."
        top_k: {type: integer, minimum: 1, maximum: 10, default: 3, description: "Maximum evidence sections."}
      required: [query]

  - name: policy_compare
    description: "Compare at least two existing policy evidence sections. Use only after policy results or explicit sections are available. Preserves sources and flags possible tensions for human review; it does not search."
    parameters:
      type: object
      properties:
        policy_sections:
          type: array
          minItems: 2
          description: "At least two policy evidence objects."
          items:
            type: object
            properties:
              doc_id: {type: string}
              policy_area: {type: string}
              title: {type: string}
              section: {type: string}
              facts: {type: string}
              content: {type: string}
              source: {type: string}
              source_path: {type: string}
              effective_date: {type: string}
            additionalProperties: true
        comparison_focus: {type: string, default: "", description: "The issue to compare."}
      required: [policy_sections]

  - name: timeline
    description: "Get recent posts FROM one specific account. Use for posts by a named person/account, not posts about a topic. Clarify if the account is missing."
    parameters:
      type: object
      properties:
        screenname: {type: string, description: "Handle without @."}
        limit: {type: integer, minimum: 1, maximum: 50, default: 5, description: "Requested post count."}
      required: [screenname]

  - name: social_search
    description: "Search social posts ABOUT a topic across accounts. Top means popular; Latest means recent."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Topic or keyword."}
        search_type: {type: string, enum: [Latest, Top], default: Latest}
        limit: {type: integer, minimum: 1, maximum: 50, default: 5}
      required: [query]

  - name: lookup
    description: "Search the public web. Use topic=news for news/current events and map today/week/month/year to timeframe day/week/month/year."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Subject only; do not append intent words such as news/tin. Example: 'tin AI' -> 'AI'."}
        topic: {type: string, enum: [general, news], default: general}
        timeframe: {type: string, enum: [day, week, month, year], default: week}
        max_results: {type: integer, minimum: 1, maximum: 20, default: 5}
      required: [query]

  - name: fetch
    description: "Read one explicit URL. Never guess a missing URL; call clarify instead."
    parameters:
      type: object
      properties:
        url: {type: string, description: "Exact absolute http(s) URL."}
      required: [url]

  - name: format
    description: "Format existing items into a digest. It does not search or retrieve new evidence."
    parameters:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: sections}
        headline: {type: string, default: ""}
      required: [items, template]

  - name: send
    description: "Send exact text to Telegram after explicit confirmation. External write: otherwise call clarify with response_type=yes_no."
    parameters:
      type: object
      properties:
        text: {type: string, description: "Exact confirmed content."}
        confirmed: {type: boolean, default: false, description: "True only after explicit confirmation."}
      required: [text, confirmed]

  - name: papers
    description: "Search arXiv for academic papers by topic; not for internal policy."
    parameters:
      type: object
      properties:
        query: {type: string}
        max_results: {type: integer, minimum: 1, maximum: 20, default: 5}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: relevance}
      required: [query]

  - name: paper_text
    description: "Extract text from one known arXiv ID or URL."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string}
        max_pages: {type: integer, minimum: 1, maximum: 50, default: 5}
        max_chars: {type: integer, minimum: 500, maximum: 50000, default: 8000}
      required: [arxiv_url]
